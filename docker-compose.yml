services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-evidence_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform_dev_password}@db:5432/${POSTGRES_DB:-evidence_platform}?schema=public
    command: ["npm", "run", "db:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform_dev_password}@db:5432/${POSTGRES_DB:-evidence_platform}?schema=public
      API_HOST: 0.0.0.0
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.invalid}
      TERMS_VERSION: ${TERMS_VERSION:-draft-v1}
      PRIVACY_VERSION: ${PRIVACY_VERSION:-draft-v1}
      SESSION_COOKIE_SECURE: "false"
    command:
      - sh
      - -c
      - npm run build --workspace @platform/shared && npm run db:generate && npm run dev:api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_ORIGIN: http://api:3000
    command:
      - sh
      - -c
      - npm run build --workspace @platform/shared && npm run dev --workspace @platform/web -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
