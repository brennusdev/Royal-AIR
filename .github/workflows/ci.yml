name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://platform:platform_dev_password@localhost:5432/evidence_platform?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_dev_password
          POSTGRES_DB: evidence_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d evidence_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:validate
      - run: npm run db:migrate:deploy
